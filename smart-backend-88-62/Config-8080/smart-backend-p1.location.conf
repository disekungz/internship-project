# 🔌 WebSocket Connection Setup
location /api_p1/ {
    # แก้ไขจาก nodeapi-SMART-NEST-API เป็นชื่อ container หรือ service ใน docker-compose
    proxy_pass http://smart-backend-p1:3000;

    # 🌐 Standard Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ⚙️ WebSocket Support (Critical)
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    # 🚫 Disable Buffering & Cache
    proxy_buffering off;
    proxy_cache_bypass $http_upgrade;
    
    # ⏱️ Timeouts (ป้องกันการตัดการเชื่อมต่อ)
    proxy_connect_timeout 60s;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}